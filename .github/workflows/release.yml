name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish"
        required: true
        type: string
      parakeet_ref:
        description: "Pinned parakeet-cli tag or commit"
        required: false
        type: string

permissions:
  contents: write

env:
  PARAKEET_REPOSITORY: lucataco/parakeet-cli
  PARAKEET_REF: v0.1.0

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and pinned parakeet ref
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PARAKEET_REF: ${{ github.event.inputs.parakeet_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_PARAKEET_REF: ${{ env.PARAKEET_REF }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' does not exist in this checkout" >&2
            exit 1
          fi

          if [ -n "$INPUT_PARAKEET_REF" ]; then
            PARAKEET_REF="$INPUT_PARAKEET_REF"
          else
            PARAKEET_REF="$DEFAULT_PARAKEET_REF"
          fi

          NOTES_FILE="docs/releases/${TAG}.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "parakeet_ref=$PARAKEET_REF" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out pinned parakeet-cli source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARAKEET_REPOSITORY }}
          ref: ${{ steps.vars.outputs.parakeet_ref }}
          path: .release/parakeet-cli

      - name: Prepare signing keychain
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_KEYCHAIN_PASSWORD != '' }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/superkeet-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/superkeet-build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Package release artifact
        env:
          PARAKEET_SOURCE_DIR: ${{ github.workspace }}/.release/parakeet-cli
          DIST_DIR: ${{ github.workspace }}/.release/dist
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          chmod +x ./scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          NOTES_FILE: ${{ steps.vars.outputs.notes_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            else
              echo "Release already exists and no notes file was found; leaving notes unchanged."
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
            fi
          fi

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release upload "$TAG" .release/dist/*.zip .release/dist/*.sha256 --clobber
