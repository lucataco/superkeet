name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish"
        required: true
        type: string
      parakeet_ref:
        description: "Pinned parakeet-cli tag or commit"
        required: false
        type: string

permissions:
  contents: write

env:
  PARAKEET_REPOSITORY: lucataco/parakeet-cli
  # Must be >= v0.1.5: the app drives first-run model provisioning via
  # `parakeet download --progress json`, which was added in v0.1.5.
  PARAKEET_REF: v0.1.5
  HOMEBREW_TAP_REPOSITORY: lucataco/homebrew-tap

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source for tag push
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out source for manual publish
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag }}

      - name: Resolve tag and pinned parakeet ref
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PARAKEET_REF: ${{ github.event.inputs.parakeet_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_PARAKEET_REF: ${{ env.PARAKEET_REF }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' does not exist in this checkout" >&2
            exit 1
          fi

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          EXPECTED_TAG="v${VERSION}"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag '$TAG' does not match Info.plist version '$VERSION' (expected '$EXPECTED_TAG')" >&2
            exit 1
          fi

          if [ -n "$INPUT_PARAKEET_REF" ]; then
            PARAKEET_REF="$INPUT_PARAKEET_REF"
          else
            PARAKEET_REF="$DEFAULT_PARAKEET_REF"
          fi

          NOTES_FILE="docs/releases/${TAG}.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "parakeet_ref=$PARAKEET_REF" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out pinned parakeet-cli source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PARAKEET_REPOSITORY }}
          ref: ${{ steps.vars.outputs.parakeet_ref }}
          path: .release/parakeet-cli

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ".release/parakeet-cli"

      - name: Resolve signing mode
        id: signing
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_CERTIFICATE_P12" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_KEYCHAIN_PASSWORD" ]; then
            echo "has_certificate=true" >> "$GITHUB_OUTPUT"
            echo "codesign_identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          else
            echo "Missing required Developer ID signing secrets for a production release" >&2
            exit 1
          fi

          if [ -n "$APPLE_NOTARY_APPLE_ID" ] && [ -n "$APPLE_NOTARY_TEAM_ID" ] && [ -n "$APPLE_NOTARY_PASSWORD" ]; then
            echo "has_notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "Missing required notarization secrets for a production release" >&2
            exit 1
          fi

      - name: Resolve Homebrew tap sync mode
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare signing keychain
        if: steps.signing.outputs.has_certificate == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/superkeet-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/superkeet-build.keychain-db"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Package release artifact
        env:
          PARAKEET_SOURCE_DIR: ${{ github.workspace }}/.release/parakeet-cli
          DIST_DIR: ${{ github.workspace }}/.release/dist
          CODESIGN_IDENTITY: ${{ steps.signing.outputs.codesign_identity }}
          REQUIRE_SIGNING: "1"
          NOTARY_APPLE_ID: ${{ steps.signing.outputs.has_notary == 'true' && secrets.APPLE_NOTARY_APPLE_ID || '' }}
          NOTARY_TEAM_ID: ${{ steps.signing.outputs.has_notary == 'true' && secrets.APPLE_NOTARY_TEAM_ID || '' }}
          NOTARY_PASSWORD: ${{ steps.signing.outputs.has_notary == 'true' && secrets.APPLE_NOTARY_PASSWORD || '' }}
        run: |
          chmod +x ./scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Clean up signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/superkeet-build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            echo "Keychain deleted."
          else
            echo "No keychain to clean up."
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          NOTES_FILE: ${{ steps.vars.outputs.notes_file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            else
              echo "Release already exists and no notes file was found; leaving notes unchanged."
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
            fi
          fi

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release upload "$TAG" .release/dist/*.zip .release/dist/*.sha256 --clobber

      - name: Check out Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: .release/homebrew-tap

      - name: Update Homebrew tap
        if: steps.tap.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          SHA256="$(shasum -a 256 .release/dist/Superkeet-${VERSION}.zip | awk '{print $1}')"
          python3 ./scripts/update_homebrew_cask.py \
            .release/homebrew-tap/Casks/superkeet.rb \
            "$VERSION" \
            "$SHA256"

      - name: Create Homebrew tap pull request
        if: steps.tap.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if git -C .release/homebrew-tap diff --quiet; then
            echo "Homebrew tap already up to date"
            exit 0
          fi

          VERSION="${TAG#v}"
          BRANCH="update-superkeet-${VERSION}"
          cd .release/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Casks/superkeet.rb
          git commit -m "Update superkeet to v${VERSION}"
          git push origin "$BRANCH"

          PR_TITLE="Update superkeet to v${VERSION}"
          PR_BODY="Automated cask update for Superkeet v${VERSION}.

          SHA256 and version bumped by the release workflow."
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --repo "${{ env.HOMEBREW_TAP_REPOSITORY }}"

      - name: Warn when tap sync is disabled
        if: steps.tap.outputs.enabled != 'true'
        run: |
          echo "HOMEBREW_TAP_TOKEN is not configured, so the Homebrew tap was not updated."
