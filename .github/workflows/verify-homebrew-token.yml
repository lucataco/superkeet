name: Verify Homebrew Token

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-homebrew-token
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out verification script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify tap token authorization
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 scripts/verify_homebrew_token.py
