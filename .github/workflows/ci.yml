name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record Swift toolchain
        id: toolchain
        run: echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache SPM build directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .build
          # Include the toolchain so an Xcode update on the runner doesn't restore stale objects.
          key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-

      - name: Install SwiftLint
        run: ./scripts/install_swiftlint.sh

      - name: Lint
        run: swiftlint lint --strict

      - name: Build app
        run: swift build

      - name: Build app (release)
        run: swift build -c release

      - name: Run test suite
        run: swift test

      - name: Test audio regression scoring
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
